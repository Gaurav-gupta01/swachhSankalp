<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Login')}"></head>

<body>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card-soft p-4">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <span class="cv-brand-mark"><img src="/img/logo.png" alt="Swachh Sankalp logo"></span>
                        <span>
                            <span class="cv-brand-name">Swachh Sankalp</span>
                            <span class="cv-brand-tag">Report &middot; Act &middot; Make a Difference</span>
                        </span>
                    </div>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm mb-3">
                        <i class="bi bi-arrow-left me-1"></i>Back to home
                    </a>

                    <h1 class="h4 section-title mb-1">Welcome back</h1>
                    <p class="text-muted small mb-4">Login to report waste or manage incoming reports.</p>

                    <div class="alert alert-danger" th:if="${error}">
                        Invalid email or password. Please try again.
                    </div>

                    <form th:action="@{/login}" th:object="${form}" method="post">
                        <input type="hidden" name="next" th:value="${next}">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Login</button>
                    </form>
                    <!-- 
                    <div class="mt-4 small text-muted border-top pt-3">
                        <div class="fw-semibold mb-1">Demo accounts</div>
                        <div>Citizen: citizen@demo.in / demo123</div>
                        <div>Officer: admin@cleanvision.gov.in / admin123</div>
                        <div>Super admin: super@cleanvision.gov.in / super123</div>
                        <div>Team leader: leader@cleanvision.gov.in / leader123</div>
                    </div> -->

                    <p class="small mt-3 mb-0">
                        No account? <a th:href="@{/register}">Register as a citizen</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
