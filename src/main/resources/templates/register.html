<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-soft p-4">
                <h1 class="h4 section-title mb-1">Create your account</h1>
                <p class="text-muted small mb-4">Report waste in under a minute and track every complaint.</p>

                <div class="alert alert-danger" th:if="${errorMessage != null}">
                    <span th:text="${errorMessage}">Error</span>
                </div>

                <form th:action="@{/register}" th:object="${form}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Full name</label>
                        <input type="text" class="form-control" th:field="*{name}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mobile number <span class="text-muted">(optional)</span></label>
                        <input type="tel" class="form-control" th:field="*{phone}">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" th:field="*{password}" minlength="6" required>
                        <div class="form-text">Minimum 6 characters.</div>
                    </div>
                    <button class="btn btn-accent w-100" type="submit">Register</button>
                </form>

                <p class="small mt-3 mb-0">
                    Already registered? <a th:href="@{/login}">Login</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
