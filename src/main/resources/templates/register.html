<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card-soft p-4">
                <h1 class="h4 section-title mb-1">Create citizen account</h1>
                <p class="text-muted small mb-4">
                    📱 Mobile is verified with an OTP. 📧 Email only needs a valid format — no code is
                    ever sent to it.
                </p>

                <div class="alert alert-danger" th:if="${errorMessage != null}">
                    <span th:text="${errorMessage}">Error</span>
                </div>

                <noscript>
                    <div class="alert alert-warning">
                        JavaScript is required to verify your mobile number.
                    </div>
                </noscript>

                <form th:action="@{/register}" th:object="${form}" method="post" id="registerForm">
                    <div data-otp-widget
                         data-purpose="REGISTER"
                         data-phone-input="phone">

                        <div class="mb-3">
                            <label class="form-label" for="name">Full name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   placeholder="Gaurav Gupta" autocomplete="name" required autofocus>
                        </div>

                        <div class="mb-2">
                            <label class="form-label" for="phone">
                                Mobile number <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">+91</span>
                                <input type="tel" class="form-control" th:field="*{phone}"
                                       placeholder="9876543210" autocomplete="tel-national"
                                       inputmode="numeric" maxlength="14" required>
                                <button class="btn btn-outline-primary" id="sendOtpBtn" type="button">
                                    Send OTP
                                </button>
                            </div>
                            <div class="form-text">Mandatory — your account activates only after this
                                number is verified.
                            </div>
                            <div class="otp-status" id="otpStatus" hidden></div>
                            <div class="text-success fw-semibold small" id="otpVerified" hidden></div>
                        </div>

                        <div class="mb-3 otp-block" id="otpBlock" hidden>
                            <label class="form-label">OTP</label>
                            <div class="d-flex align-items-center gap-3 flex-wrap">
                                <div class="otp-boxes" id="otpBoxes">
                                    <input class="otp-box" inputmode="numeric" maxlength="1"
                                           aria-label="OTP digit 1" autocomplete="one-time-code">
                                    <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="OTP digit 2">
                                    <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="OTP digit 3">
                                    <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="OTP digit 4">
                                    <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="OTP digit 5">
                                    <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="OTP digit 6">
                                </div>
                                <button class="btn btn-success btn-sm" id="verifyOtpBtn" type="button">
                                    Verify ✓
                                </button>
                                <button class="btn btn-link btn-sm p-0" id="resendOtpBtn" type="button">
                                    Resend
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">
                                Email address <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   placeholder="example@gmail.com" autocomplete="email" required>
                            <div class="form-text" id="emailHint"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">
                                Password <span class="text-danger">*</span>
                            </label>
                            <input type="password" class="form-control" th:field="*{password}"
                                   minlength="6" autocomplete="new-password" required>
                            <div class="form-text">Minimum 6 characters.</div>
                        </div>

                        <button class="btn btn-accent w-100" type="submit" id="submitBtn" disabled>
                            Create Account
                        </button>
                        <div class="form-text text-center mt-2">
                            Enabled once your mobile is verified.
                        </div>
                    </div>
                </form>

                <p class="small mt-3 mb-0">
                    Already registered? <a th:href="@{/login}">Login</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/otp.js}"></script>
</body>
</html>
