<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Register')}"></head>

<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card-soft p-4">
                    <h1 class="h4 section-title mb-1">Create citizen account</h1>
                    <p class="text-muted small mb-4">
                        📱 Add your mobile number so crews can call you back.
                    </p>

                    <div class="alert alert-danger" th:if="${errorMessage != null}">
                        <span th:text="${errorMessage}">Error</span>
                    </div>

                    <form th:action="@{/register}" th:object="${form}" method="post" id="registerForm">
                        <div class="mb-3">
                            <label class="form-label" for="name">Full name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="Eg. Gaurav Gupta"
                                autocomplete="name" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone">
                                Mobile number <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">+91</span>
                                <input type="tel" class="form-control" th:field="*{phone}" placeholder="Eg. 9876543210"
                                    autocomplete="tel-national" inputmode="numeric" maxlength="14" required>
                            </div>
                            <!-- <div class="form-text">10 digits, starting 6–9.</div> -->
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">
                                Email address <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="example@gmail.com"
                                autocomplete="email" required>
                            <!-- <div class="form-text">Format only — we never send email codes.</div> -->
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">
                                Password <span class="text-danger">*</span>
                            </label>
                            <input type="password" class="form-control" th:field="*{password}" minlength="6"
                                autocomplete="new-password" required>
                            <div class="form-text">Minimum 6 characters.</div>
                        </div>

                        <button class="btn btn-accent w-100" type="submit" id="submitBtn">
                            Create Account
                        </button>
                    </form>

                    <p class="small mt-3 mb-0">
                        Already registered? <a th:href="@{/login}">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
