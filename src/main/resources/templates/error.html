<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-soft p-4 text-center">
                <div class="display-5 text-danger mb-2" th:text="${status != null ? status : 500}">500</div>
                <h1 class="h5 section-title mb-2">Something went wrong</h1>
                <p class="text-muted" th:text="${message != null ? message : 'Unexpected error.'}">
                    Unexpected error.
                </p>
                <p class="small text-muted" th:if="${detail != null}" th:text="${detail}">Detail</p>
                <a th:href="@{/}" class="btn btn-primary mt-2">Back to home</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
