<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cleanup Teams')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 section-title mb-1">Cleanup Teams</h1>
            <div class="text-muted small">Ward-wise teams available for assignment.</div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/teams/new}" class="btn btn-accent btn-sm">
                <i class="bi bi-plus-lg me-1"></i>New Team
            </a>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-xl-4" th:each="team : ${teams}">
            <div class="card-soft p-4 h-100">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <div class="fw-semibold fs-5" th:text="${team.teamName}">Team A</div>
                        <div class="small text-muted" th:text="${team.ward != null ? team.ward : '-'}">Ward 1</div>
                        <span class="badge text-bg-info mt-1"
                              th:if="${team.teamType != null}"
                              th:text="${team.teamType.icon + ' ' + team.teamType.label}">♻️ Waste cleanup</span>
                    </div>
                    <span class="badge"
                          th:classappend="${team.active ? 'text-bg-success' : 'text-bg-secondary'}"
                          th:text="${team.active ? 'Active' : 'Inactive'}">Active</span>
                </div>
                <div class="small mb-1">
                    <i class="bi bi-person-badge me-2 text-muted"></i>
                    <span th:text="${team.leader != null ? team.leader : '-'}">Rahul Sawant</span>
                </div>
                <div class="small mb-3">
                    <i class="bi bi-telephone me-2 text-muted"></i>
                    <span th:text="${team.contact != null ? team.contact : '-'}">9822011111</span>
                </div>
                <div class="small mb-3" th:if="${leaderLogins[team.id] != null}">
                    <i class="bi bi-key me-2 text-muted"></i>
                    <span class="text-muted">Leader login:</span>
                    <span th:text="${leaderLogins[team.id]}">leader@cleanvision.gov.in</span>
                </div>
                <div class="border-top pt-3 d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small">Open assignments</span>
                    <span class="badge text-bg-primary" th:text="${workload[team.id]}">0</span>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary flex-fill"
                       th:href="@{/admin/teams/{id}/edit(id=${team.id})}">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                    <form th:action="@{/admin/teams/{id}/delete(id=${team.id})}" method="post" class="flex-fill"
                          onsubmit="return confirm('Delete this team? This cannot be undone.');">
                        <button class="btn btn-sm btn-outline-danger w-100" type="submit">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="empty-state mt-4" th:if="${#lists.isEmpty(teams)}">
        No cleanup teams are configured yet. Create the first one.
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
