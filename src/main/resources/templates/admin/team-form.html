<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cleanup Team')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 section-title mb-1" th:text="${editing ? 'Edit Cleanup Team' : 'New Cleanup Team'}">Cleanup Team</h1>
            <div class="text-muted small"
                 th:text="${editing ? 'Update team details below.' : 'Add a ward team that reports can be assigned to.'}">
                Team details
            </div>
        </div>
        <a th:href="@{/admin/teams}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to teams
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card-soft p-4">
                <div class="alert alert-danger" th:if="${errorMessage != null}">
                    <span th:text="${errorMessage}">Error</span>
                </div>

                <form th:object="${form}" method="post"
                      th:action="${editing ? '/admin/teams/' + teamId : '/admin/teams'}">
                    <div class="mb-3">
                        <label class="form-label">Team name</label>
                        <input type="text" class="form-control" th:field="*{teamName}" placeholder="Team D" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ward</label>
                        <input type="text" class="form-control" th:field="*{ward}" placeholder="Ward 4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Team leader</label>
                        <input type="text" class="form-control" th:field="*{leader}" placeholder="Full name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contact number</label>
                        <input type="tel" class="form-control" th:field="*{contact}" placeholder="9822044444">
                    </div>
                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" id="teamActive">
                        <label class="form-check-label" for="teamActive">Active (available for assignment)</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-accent" type="submit">
                            <i class="bi bi-check2 me-1"></i><span th:text="${editing ? 'Save changes' : 'Create team'}">Save</span>
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/teams}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
