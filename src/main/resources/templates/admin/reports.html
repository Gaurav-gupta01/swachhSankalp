<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Reports')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 section-title mb-1">Report Management</h1>
            <div class="text-muted small">
                <span th:text="${#lists.size(reports)}">0</span> report(s) match the current filter.
            </div>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
        </a>
    </div>

    <form class="card-soft p-3 mb-4" method="get" th:action="@{/admin/reports}">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small mb-1">Status</label>
                <select class="form-select form-select-sm" name="status">
                    <option value="">All statuses</option>
                    <option th:each="s : ${statuses}" th:value="${s.name()}"
                            th:text="${s.label}" th:selected="${s.name() == selectedStatus}">Assigned</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Severity</label>
                <select class="form-select form-select-sm" name="severity">
                    <option value="">All severities</option>
                    <option th:each="s : ${severities}" th:value="${s.name()}"
                            th:text="${s.label}" th:selected="${s.name() == selectedSeverity}">High</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">Ward</label>
                <select class="form-select form-select-sm" name="ward">
                    <option value="">All wards</option>
                    <option th:each="w : ${wards}" th:value="${w}"
                            th:text="${w}" th:selected="${w == selectedWard}">Ward 1</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary btn-sm flex-fill" type="submit">Apply filter</button>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/reports}">Reset</a>
            </div>
        </div>
    </form>

    <div class="card-soft p-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Report</th>
                    <th>Image</th>
                    <th>Type</th>
                    <th>Confidence</th>
                    <th>Severity</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Reported</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reports}">
                    <td class="fw-semibold" th:text="${report.publicId}">CV10001</td>
                    <td>
                        <img th:src="@{'/uploads/' + ${report.imageUrl}}" alt=""
                             style="width:56px;height:44px;object-fit:cover;border-radius:.4rem;background:#10201a">
                    </td>
                    <td>
                        <span th:text="${report.wasteType.icon}"></span>
                        <span th:text="${report.wasteType.label}">Plastic</span>
                    </td>
                    <td>
                        <span class="confidence-pill"
                              th:classappend="${report.confidence < 0.6 ? 'low' : ''}"
                              th:text="${#numbers.formatDecimal(report.confidence * 100, 1, 0)} + '%'">94%</span>
                    </td>
                    <td>
                        <span class="badge-severity badge"
                              th:classappend="'sev-' + ${report.severity}"
                              th:text="${report.severity.label}">High</span>
                    </td>
                    <td class="small">
                        <span th:text="${report.ward != null ? report.ward : '-'}">Ward 5</span><br>
                        <span class="text-muted" th:text="${report.address != null ? report.address : ''}">Address</span>
                    </td>
                    <td>
                        <span class="badge-status badge st-submitted"
                              th:classappend="'st-' + ${#strings.replace(report.status.label,' ','_')}"
                              th:text="${report.status.label}">Pending</span>
                    </td>
                    <td class="small text-muted"
                        th:text="${#temporals.format(report.createdAt, 'dd MMM, HH:mm')}">time</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{'/admin/reports/' + ${report.publicId}}">Manage</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reports)}">
                    <td colspan="9" class="text-center text-muted py-4">No reports match this filter.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
