<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Account')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 section-title mb-1">Edit account</h1>
            <div class="text-muted small"
                 th:text="${user.name + ' · ' + user.email}">Account details</div>
        </div>
        <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to users
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card-soft p-4">
                <div class="alert alert-danger" th:if="${errorMessage != null}">
                    <span th:text="${errorMessage}">Error</span>
                </div>

                <form th:object="${form}" method="post" th:action="'/admin/users/' + ${user.id}">
                    <div class="mb-3">
                        <label class="form-label">Full name</label>
                        <input type="text" class="form-control" th:field="*{name}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mobile number <span class="text-muted">(optional)</span></label>
                        <input type="tel" class="form-control" th:field="*{phone}" placeholder="9876543210">
                        <div class="form-text">10 digits, starting 6–9.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New password <span class="text-muted">(optional)</span></label>
                        <input type="password" class="form-control" th:field="*{password}" minlength="6"
                               autocomplete="new-password">
                        <div class="form-text">Leave blank to keep the current password.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" th:field="*{role}">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}">Role</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Cleanup team <span class="text-muted">(team leaders only)</span></label>
                        <select class="form-select" th:field="*{teamId}">
                            <option value="">— none —</option>
                            <option th:each="t : ${teams}" th:value="${t.id}"
                                    th:text="${t.teamName + ' (' + (t.ward != null ? t.ward : 'no ward') + ')'}">Team A</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-accent" type="submit">
                            <i class="bi bi-check2 me-1"></i>Save changes
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
                    </div>
                </form>

                <div class="border-top mt-4 pt-3 small text-muted">
                    Changing the role changes what this account can reach as soon as it
                    signs in again.
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
