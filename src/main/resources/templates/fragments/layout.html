<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · CleanVision AI'">CleanVision AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/vendor/leaflet/leaflet.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark cv-topbar">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/}">
                <i class="bi bi-recycle me-2"></i>CleanVision <span class="ai-badge">AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cvNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="cvNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.canReport()}">
                        <a class="nav-link" th:href="@{/report/new}"><i class="bi bi-camera me-1"></i>Report Waste</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.canReport()}">
                        <a class="nav-link" th:href="@{/my-reports}"><i class="bi bi-journal-check me-1"></i>My Reports</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.isTeamLeader()}">
                        <a class="nav-link" th:href="@{/team}"><i class="bi bi-clipboard-check me-1"></i>My Team Queue</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.isOfficer()}">
                        <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2 me-1"></i>Municipal Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.isOfficer()}">
                        <a class="nav-link" th:href="@{/admin/reports}"><i class="bi bi-list-ul me-1"></i>Reports</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.isOfficer()}">
                        <a class="nav-link" th:href="@{/admin/teams}"><i class="bi bi-people me-1"></i>Teams</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.isOfficer()}">
                        <a class="nav-link" th:href="@{/admin/analytics}"><i class="bi bi-bar-chart-line me-1"></i>Analytics</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'SUPER_ADMIN'}">
                        <a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-person-gear me-1"></i>Users</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" th:if="${currentUser == null}">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null}">
                        <a class="btn btn-sm btn-accent ms-lg-2" th:href="@{/register}">Register</a>
                    </li>
                    <li class="nav-item dropdown" th:if="${currentUser != null}">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i><span th:text="${currentUser.name}">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text small text-muted"
                                      th:text="${currentUser.role.label}">Citizen</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="flash">
    <div class="container mt-3">
        <div class="alert alert-success alert-dismissible fade show" th:if="${flashMessage != null}">
            <i class="bi bi-check-circle me-1"></i><span th:text="${flashMessage}">Saved</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMessage != null}">
            <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
</div>

<footer th:fragment="footer">
    <div class="border-top mt-5 py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <span class="text-muted small">CleanVision AI — from a photograph to municipal action.</span>
            <span class="text-muted small">Environment / Smart City / AI Project</span>
        </div>
    </div>
</footer>

</body>
</html>
