spring:
  application:
    name: cleanvision-ai

  datasource:
    url: jdbc:mysql://localhost:3306/cleanvision?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # kept true so Thymeleaf templates can read lazy relations after the service layer
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  thymeleaf:
    cache: false

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

cleanvision:
  upload-dir: ${CLEANVISION_UPLOAD_DIR:./uploads}
  session-ttl-minutes: 720
