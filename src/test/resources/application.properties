# Test-only configuration: an in-memory database so the suite never touches MySQL dev data.
spring.datasource.url=jdbc:h2:mem:cleanvision_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.thymeleaf.cache=false

cleanvision.upload-dir=./target/test-uploads
cleanvision.session-ttl-minutes=720

# OTP delivery is stubbed in tests — no SMS leaves the machine.
cleanvision.msg91.auth-key=
cleanvision.otp.resend-cooldown-seconds=0
cleanvision.otp.max-sends-per-hour=100
